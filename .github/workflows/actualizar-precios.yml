name: Actualizar precios (Petroperú + Repsol)

on:
  schedule:
    - cron: "0 12,18,0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests pdfplumber
          python -m playwright install --with-deps chromium

      - name: Ejecutar scraper
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          POWERAUTOMATE_URL: ${{ secrets.POWERAUTOMATE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERTA_EMAIL_TO: ${{ secrets.ALERTA_EMAIL_TO }}
        run: python actualizar_precios.py

      - name: Publicar data.json e histórico
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add data.json historico.json actualizar_precios.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Precios actualizados $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
